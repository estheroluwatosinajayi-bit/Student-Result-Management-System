<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Student Scores</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            color: #172554;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
        }

        button {
            background: #172554;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            margin-top: 20px;
            width: 100%;
            cursor: pointer;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        .message {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <div class="container">

        <a href="/">← Back to Dashboard</a>

        <h1>Enter Student Scores</h1>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Select Student</label>
            <select name="student_id" required>
                <option value="">Choose a student</option>
                {% for student in students %}
                    <option value="{{ student.student_id }}">
                        {{ student.name }} - {{ student.student_id }}
                    </option>
                {% endfor %}
            </select>

            {% for subject in subjects %}
                <label>{{ subject }}</label>
                <input
                    type="number"
                    name="{{ subject }}"
                    min="0"
                    max="100"
                    step="0.01"
                    required
                >
            {% endfor %}

            <button type="submit">Save Results</button>

        </form>

    </div>
</body>
</html>
